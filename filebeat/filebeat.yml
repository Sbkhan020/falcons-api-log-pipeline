# Filebeat -> Loki (Task 2)
# Reads auth.log, syslog and the sample API log, ships them to Loki on :3100
filebeat.inputs:
  - type: log
    enabled: true
    paths:
      - /var/log/auth.log
    fields:
      log_source: auth.log
    fields_under_root: true
  - type: log
    enabled: true
    paths:
      - /var/log/syslog
    fields:
      log_source: syslog
    fields_under_root: true
  - type: log
    enabled: true
    paths:
      - /home/sumyan/falcons-api/logs/api-access.log
    fields:
      log_source: api-access
    fields_under_root: true
output.loki:
  enabled: true
  hosts: ["http://localhost:3100"]
  labels:
    job: falcons-api
processors:
  - add_host_metadata: ~
